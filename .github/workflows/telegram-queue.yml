# Posts the rest of the morning news to the Telegram channel, one story at
# a time, at least 2.5 hours apart (see scripts/news/telegram.mts). Runs every
# hour from 08:20 to 22:20 Tashkent time; most runs find nothing due and
# finish in seconds.
name: Telegram queue

on:
  schedule:
    - cron: "20 3-17 * * *"
  workflow_dispatch:

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Load Telegram queue
        id: load
        uses: actions/cache/restore@v4
        with:
          path: .telegram
          key: tg-state-${{ github.run_id }}
          restore-keys: tg-state-

      - name: Post the next story if it is due
        if: steps.load.outputs.cache-matched-key != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_CHAT_ID: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
          TELEGRAM_NEWS_LANG: ${{ vars.TELEGRAM_NEWS_LANG }}
        run: node scripts/news/telegram.mts

      - name: Save Telegram queue
        if: always() && steps.load.outputs.cache-matched-key != ''
        uses: actions/cache/save@v4
        with:
          path: .telegram
          key: tg-state-${{ github.run_id }}-${{ github.run_attempt }}
