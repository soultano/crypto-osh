# Writes 3–4 crypto news stories every morning (07:00 Tashkent; GitHub
# can start scheduled runs late, so this leaves room), commits
# them to main so Vercel redeploys the site, then queues them for Telegram
# and posts the first one (telegram-queue.yml posts the rest during the day).
# Secrets (repo → Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY       required
#   TELEGRAM_BOT_TOKEN      optional, for posting to the channel
#   TELEGRAM_NEWS_CHAT_ID   optional, e.g. @soulweb or -100…
# Variable (same page, "Variables" tab):
#   TELEGRAM_NEWS_LANG      optional, uz | ru | en (default uz)
name: Daily news

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many stories (1–10); empty = the usual 3–4"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Write today's news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MIN: ${{ inputs.count }}
          NEWS_MAX: ${{ inputs.count }}
        run: node scripts/news/generate.mts

      - name: Commit and push
        id: push
        run: |
          git add content/articles
          if git diff --cached --quiet; then
            echo "No new articles."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Crypto Osh News"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "News for $(TZ=Asia/Tashkent date +%F)"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Load Telegram queue
        if: steps.push.outputs.pushed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .telegram
          key: tg-state-${{ github.run_id }}
          restore-keys: tg-state-

      - name: Post to Telegram
        id: telegram
        if: steps.push.outputs.pushed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NEWS_CHAT_ID: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
          TELEGRAM_NEWS_LANG: ${{ vars.TELEGRAM_NEWS_LANG }}
        run: node scripts/news/telegram.mts

      - name: Save Telegram queue
        if: always() && steps.telegram.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .telegram
          key: tg-state-${{ github.run_id }}-${{ github.run_attempt }}
